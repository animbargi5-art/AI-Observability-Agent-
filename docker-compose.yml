services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tattvaai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=debug
      - DEMO_MODE=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-ingester:4317
      - SIGNOZ_API_URL=http://signoz-signoz-0:8080
      - SIGNOZ_MCP_SERVER=http://signoz-mcp:8000/mcp
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - tattvaai-network
      - signoz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tattvaai-frontend
    ports:
      - "3001:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    networks:
      - tattvaai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: gateway }
    ports: ["8011:8000"]
    environment: ["OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://signoz-ingester:4318/v1/traces"]
    networks: [tattvaai-network, signoz-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  inventory:
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: inventory }
    ports: ["8002:8000"]
    environment: ["OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://signoz-ingester:4318/v1/traces"]
    networks: [tattvaai-network, signoz-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  payment:
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: payment }
    ports: ["8004:8000"]
    environment: ["OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://signoz-ingester:4318/v1/traces"]
    networks: [tattvaai-network, signoz-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  order:
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: order }
    ports: ["8003:8000"]
    environment: ["OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://signoz-ingester:4318/v1/traces"]
    depends_on:
      inventory: { condition: service_healthy }
      payment: { condition: service_healthy }
    networks: [tattvaai-network, signoz-network]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tattvaai-network:
    driver: bridge
  signoz-network:
    external: true
    name: signoz-network
